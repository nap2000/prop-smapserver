<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Two Factor Authentication</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="/css/bootstrap.v5.3.8.min.css" rel="stylesheet">
    <link href="/custom/css/custom.css" rel="stylesheet">
    <link href="/css/fa.v5.15.1.all.min.css" rel="stylesheet">
    <link href="/css/smap3.css" rel="stylesheet">

    <script src="/js/app/theme.js"></script>
    <script src="/js/app/bootstrapHelpers.js"></script>
    <script src="/js/app/error-logger.js"></script>
    <script src="/js/libs/modernizr.js"></script>
    <script src="/js/libs/jquery-3.5.1.min.js"></script>
    <script src="/js/libs/bootstrap.bundle.v5.3.8.min.js"></script>
    <script src="/js/twoFactor.js"></script>
</head>
<body>
    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="mb-4">Two Factor Authentication</h2>
                <p>Enter the current 6 digit code from your authenticator app.</p>
                <form id="tfChallengeForm">
                    <div class="mb-3">
                        <label for="code" class="form-label">Code</label>
                        <input type="text" class="form-control" id="code" name="code" required
                               inputmode="numeric" autocomplete="one-time-code" maxlength="6" autofocus>
                    </div>
                    <button type="submit" id="tfSubmit" class="btn btn-primary">Continue</button>
                    <div id="tfAlert" class="alert alert-danger d-none mt-4" role="alert"></div>
                </form>
                <p class="mt-4 text-muted">
                    Lost your device? Ask an administrator to reset your two factor authentication.
                </p>
                <p><a class="button" href="/dologout.html">Log out</a></p>
            </div>
        </div>
    </main>
</body>
</html>
